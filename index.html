<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starboard</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">STARBOARD</div>
      <div class="status">
        <span id="room-label">—</span>
        <span id="peer-count">0 pair</span>
      </div>
      <div class="identity">
        <button id="btn-name" class="link" title="Changer de nom">—</button>
        <select id="role-select" title="Rôle">
          <option value="player">Joueur</option>
          <option value="gm">MJ</option>
        </select>
      </div>
      <div class="tools">
        <div class="seg" id="roll-mode" title="Mode des jets">
          <button data-mode="normal" class="on">Normal</button>
          <button data-mode="adv">Avantage</button>
          <button data-mode="dis">Désavantage</button>
        </div>
        <label class="check" title="Jet visible seulement par toi et le MJ">
          <input type="checkbox" id="secret-roll" /> Jet secret
        </label>
        <span class="sep"></span>
        <button id="btn-add">+ Pion</button>
        <button id="btn-d6">d6</button>
        <button id="btn-d20">d20</button>
        <button id="btn-d100">d100</button>
        <span class="sep"></span>
        <button id="btn-export">Exporter</button>
        <label class="btn" for="file-import">Importer</label>
        <input id="file-import" type="file" accept="application/json" hidden />
      </div>
    </header>

    <main>
      <aside class="crew">
        <h2>Équipage <button id="btn-new-sheet" class="small">+ Fiche</button></h2>
        <ul id="crew-list"></ul>
      </aside>
      <div class="stage">
        <canvas id="board"></canvas>
        <section id="sheet" class="sheet" hidden></section>
      </div>
      <aside class="log">
        <h2>Journal</h2>
        <ul id="log-list"></ul>
      </aside>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starboard</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">STARBOARD</div>
      <div class="status">
        <span id="room-label">—</span>
        <span id="peer-count">0 pair</span>
      </div>
      <div class="identity">
        <select id="name-select" title="Qui es-tu ?"></select>
        <select id="role-select" title="Rôle">
          <option value="player">Joueur</option>
          <option value="gm">MJ</option>
        </select>
      </div>
      <nav class="view-tabs" id="view-tabs">
        <button data-view="ship">Vaisseau</button>
        <button data-view="map">Carte</button>
      </nav>
      <div class="tools">
        <div class="seg" id="roll-mode" title="Mode des jets">
          <button data-mode="normal" class="on">Normal</button>
          <button data-mode="adv">Avantage</button>
          <button data-mode="dis">Désavantage</button>
        </div>
        <label class="check" title="Jet visible seulement par toi et le MJ">
          <input type="checkbox" id="secret-roll" /> Jet secret
        </label>
        <span class="sep"></span>
        <button id="btn-add">+ Pion</button>
        <button id="btn-d6">d6</button>
        <button id="btn-d20">d20</button>
        <button id="btn-d100">d100</button>
        <span class="sep"></span>
        <button id="btn-export">Exporter</button>
        <label class="btn" for="file-import">Importer</label>
        <input id="file-import" type="file" accept="application/json" hidden />
      </div>
    </header>

    <main>
      <aside class="crew">
        <h2>Vaisseau</h2>
        <ul>
          <li id="ship-item" class="crew-item ship-item">
            <span class="badge-dot" style="--badge: var(--accent)"></span>
            <span class="crew-name">Gaïa</span>
            <span id="ship-summary" class="crew-post">—</span>
          </li>
        </ul>
        <h2>Équipage <button id="btn-new-sheet" class="small">+ Fiche</button></h2>
        <ul id="crew-list"></ul>
      </aside>
      <div class="stage">
        <canvas id="board"></canvas>
        <div id="scene-bar" class="stage-bar"></div>
        <div class="zoom-bar">
          <button id="btn-zoom-out" class="small" title="Dézoomer">−</button>
          <span id="zoom-label">100 %</span>
          <button id="btn-zoom-in" class="small" title="Zoomer">+</button>
          <button id="btn-fit" class="small" title="Recadrer sur la carte">Recadrer</button>
        </div>
        <section id="sheet" class="sheet" hidden></section>
        <section id="ship-panel" class="sheet ship" hidden></section>
      </div>
      <aside class="log">
        <section id="music" class="music"></section>
        <h2>Journal</h2>
        <ul id="log-list"></ul>
      </aside>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
